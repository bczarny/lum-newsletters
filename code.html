<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luminate Footer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .footer {
    width: 640px;
    background-color: #101014;
    padding: 34px 30px 27px;
    font-family: 'Aktiv Grotesk', 'Inter', 'Helvetica Neue', Arial, sans-serif;
  }

  /* ── Top row ── */
  .footer-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 88px;
  }

  .social-icons {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .social-icons a {
    display: inline-flex;
    color: #88898c;
    text-decoration: none;
  }

  .social-icons svg {
    width: 19px;
    height: 19px;
    fill: #88898c;
  }

  .footer-actions {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 12px;
  }

  .manage-btn {
    display: inline-block;
    padding: 5px;
    border: 1px solid #88898c;
    background: transparent;
    color: #88898c;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    line-height: 1;
  }

  .unsubscribe {
    font-size: 10px;
    font-weight: 600;
    color: #88898c;
    text-decoration: underline;
  }

  /* ── Bottom row ── */
  .footer-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo {
    font-family: 'Impact', 'Haettenschweiler', 'Arial Narrow Bold', sans-serif;
    font-size: 36px;
    font-weight: 900;
    color: white;
    letter-spacing: 2px;
    line-height: 1;
    text-transform: uppercase;
    /* Condensed look */
    font-stretch: condensed;
    -webkit-text-stroke: 1px white;
  }

  .footer-legal {
    display: flex;
    flex-direction: column;
    gap: 12px;
    text-align: left;
  }

  .footer-legal p,
  .footer-legal a {
    font-size: 10px;
    font-weight: 600;
    color: #88898c;
    text-decoration: none;
    line-height: 1;
  }

  .footer-legal a:hover {
    text-decoration: underline;
  }

  .legal-links {
    display: flex;
    gap: 6px;
  }

  .legal-links .separator {
    color: #88898c;
  }
</style>
</head>
<body>

<footer class="footer">
  <!-- Top row -->
  <div class="footer-top">
    <div class="social-icons">

    </div>

    <div class="footer-actions">
      <a href="#" class="manage-btn">Manage Your Email Preferences</a>
      <a href="#" class="unsubscribe">Unsubscribe from all Luminate email</a>
    </div>
  </div>

  <!-- Bottom row -->
  <div class="footer-bottom">
    <div class="logo">LUMINATE</div>

    <div class="footer-legal">
      <div class="legal-links">
        <a href="#">Privacy Policy</a>

</footer>

</html>
